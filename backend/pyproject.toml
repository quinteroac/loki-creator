[project]
name = "loki-creator-backend"
version = "0.1.0"
description = "Backend API for Loki Creator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "comfy-diffusion[all]==2.2.0",
  "fastapi>=0.124.2",
  "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
